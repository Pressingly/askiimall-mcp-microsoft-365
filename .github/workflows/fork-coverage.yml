# This fork's own workflow: upstream does not have it, and it is not guarded to
# upstream's repository (see test/fork-upstream-workflows.test.ts).
#
# It fails a pull request when the statement coverage of one of the files our
# patches live in drops below its limit in vitest.fork-coverage.config.ts, for
# example after an upstream merge adds untested code there or loses our tests.
name: Fork coverage

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate
        run: npm run generate

      - name: Run tests with the per-file coverage limits
        run: npx vitest run --config vitest.fork-coverage.config.ts
